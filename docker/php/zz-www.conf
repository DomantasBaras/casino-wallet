[www]
; The base image ships pm.max_children = 5. Fine for a demo app, useless for a
; concurrency test: 50 inbound requests would be served five at a time, and the
; queueing would mask most of the contention we are trying to observe.
;
; static rather than dynamic so the worker count is exact and the test is
; reproducible run to run.
pm = static
pm.max_children = 50