services:
  app:
    build:
      context: ./docker/php
    container_name: cw-app
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: cw-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: cw-mysql
    environment:
      MYSQL_DATABASE: casino_wallet
      MYSQL_USER: casino
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    # Host port is 3307 so this never collides with a MySQL you already run locally.
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: cw-redis
    ports:
      - "6380:6379"

volumes:
  mysql-data:
